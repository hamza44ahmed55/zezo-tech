<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Reader</title>
    <link rel="icon" href="/min/img/zezo - logo - png.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: auto;
        }
        video {
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
            border: 2px solid #007bff;
            border-radius: 8px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        .hidden {
            display: none;
        }
        input[type="file"] {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #007bff;
            border-radius: 5px;
        }
        #qrResult {
            font-weight: bold;
            margin-top: 15px;
            color: #28a745;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QR Code Reader</h1>

        <!-- Buttons created in HTML -->
        <button id="startBtn">Start Camera</button>
        <button id="stopBtn" class="hidden">Stop Camera</button>
        <video id="camera" autoplay playsinline class="hidden"></video>
        
        <h3>Or Upload QR Code Image</h3>
        <!-- File input to choose the QR code image -->
        <input type="file" id="qrImage" accept="image/*">
        
        <p id="qrResult"></p>

        <!-- Additional buttons -->
        <button id="copyBtn" class="hidden">Copy</button>
        <button id="openLinkBtn" class="hidden">Open Link</button>
        <button id="rescanBtn" class="hidden">Rescan</button>
        
        <canvas id="captureCanvas" class="hidden"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <script>
        let video = document.getElementById("camera");
        let canvas = document.getElementById("captureCanvas");
        let ctx = canvas.getContext("2d");
        let qrResult = document.getElementById("qrResult");
        let copyBtn = document.getElementById("copyBtn");
        let openLinkBtn = document.getElementById("openLinkBtn");
        let rescanBtn = document.getElementById("rescanBtn");
        let beep = new Audio("https://www.soundjay.com/button/beep-07.wav");
        let stream;

        document.getElementById("startBtn").addEventListener("click", startCamera);
        document.getElementById("stopBtn").addEventListener("click", stopCamera);
        document.getElementById("qrImage").addEventListener("change", handleImageUpload);
        copyBtn.addEventListener("click", () => navigator.clipboard.writeText(qrResult.textContent));
        openLinkBtn.addEventListener("click", () => window.open(qrResult.textContent, "_blank"));
        rescanBtn.addEventListener("click", resetScanner);

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(camStream => {
                stream = camStream;
                video.srcObject = stream;
                video.classList.remove("hidden");
                document.getElementById("stopBtn").classList.remove("hidden");
                document.getElementById("startBtn").classList.add("hidden");
                scanQRCode();
            })
            .catch(err => alert("Camera access denied. Please enable your camera."));
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.classList.add("hidden");
            document.getElementById("stopBtn").classList.add("hidden");
            document.getElementById("startBtn").classList.remove("hidden");
        }

        function scanQRCode() {
            if (!video.srcObject) return;
            requestAnimationFrame(scanQRCode);
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let qrCode = jsQR(imageData.data, canvas.width, canvas.height);
            if (qrCode) {
                qrResult.textContent = qrCode.data;
                copyBtn.classList.remove("hidden");
                rescanBtn.classList.remove("hidden");
                if (qrCode.data.startsWith("http")) {
                    openLinkBtn.classList.remove("hidden");
                }
                beep.play();
            }
        }

        function handleImageUpload(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function () {
                let img = new Image();
                img.src = reader.result;
                img.onload = function () {
                    let scale = 500 / Math.max(img.width, img.height);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let qrCode = jsQR(imageData.data, canvas.width, canvas.height);
                    qrResult.textContent = qrCode ? qrCode.data : "No QR code found.";
                    copyBtn.classList.toggle("hidden", !qrCode);
                    openLinkBtn.classList.toggle("hidden", !(qrCode && qrCode.data.startsWith("http")));
                    rescanBtn.classList.remove("hidden");
                };
            };
            reader.readAsDataURL(file);
        }

        function resetScanner() {
            qrResult.textContent = "";
            copyBtn.classList.add("hidden");
            openLinkBtn.classList.add("hidden");
            rescanBtn.classList.add("hidden");
            if (video.srcObject) {
                scanQRCode();
            }
        }
    </script>
</body>
</html>
