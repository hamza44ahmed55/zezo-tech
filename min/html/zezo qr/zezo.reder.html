<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Reader</title>
    <link rel="icon" href="/min/img/zezo - logo - png.png" type="image/png">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        video { width: 100%; max-width: 400px; margin-top: 10px; border: 1px solid #ccc; }
        button { margin: 10px; padding: 10px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>QR Code Reader</h1>
        <button id="startBtn">Start Camera</button>
        <button id="stopBtn" class="hidden">Stop Camera</button>
        <video id="camera" autoplay playsinline class="hidden"></video>
        
        <h3>Or Upload QR Code Image</h3>
        <input type="file" id="qrImage" accept="image/*">
        
        <p id="qrResult"></p>
        <button id="copyBtn" class="hidden">Copy</button>

        <canvas id="captureCanvas" class="hidden"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <script>
        let video = document.getElementById("camera");
        let canvas = document.getElementById("captureCanvas");
        let ctx = canvas.getContext("2d");
        let qrResult = document.getElementById("qrResult");
        let copyBtn = document.getElementById("copyBtn");
        let stream;

        document.getElementById("startBtn").addEventListener("click", startCamera);
        document.getElementById("stopBtn").addEventListener("click", stopCamera);
        document.getElementById("qrImage").addEventListener("change", handleImageUpload);
        copyBtn.addEventListener("click", () => navigator.clipboard.writeText(qrResult.textContent));

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(camStream => {
                stream = camStream;
                video.srcObject = stream;
                video.classList.remove("hidden");
                document.getElementById("stopBtn").classList.remove("hidden");
                document.getElementById("startBtn").classList.add("hidden");
                scanQRCode();
            })
            .catch(err => alert("Camera access denied. Please enable your camera."));
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            video.classList.add("hidden");
            document.getElementById("stopBtn").classList.add("hidden");
            document.getElementById("startBtn").classList.remove("hidden");
        }

        function scanQRCode() {
            if (!video.srcObject) return;
            requestAnimationFrame(scanQRCode);
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let qrCode = jsQR(imageData.data, canvas.width, canvas.height);
            if (qrCode) {
                qrResult.textContent = qrCode.data;
                copyBtn.classList.remove("hidden");
            }
        }

        function handleImageUpload(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function () {
                let img = new Image();
                img.src = reader.result;
                img.onload = function () {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0, img.width, img.height);
                    let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let qrCode = jsQR(imageData.data, canvas.width, canvas.height);
                    qrResult.textContent = qrCode ? qrCode.data : "No QR code found.";
                    copyBtn.classList.toggle("hidden", !qrCode);
                };
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
